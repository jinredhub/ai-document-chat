<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- allow CSP blob: workers for pdf.js -->
    <meta http-equiv="Content-Security-Policy" content="worker-src 'self' blob:; child-src 'self' blob:;">
    <title>PDF AI Assistant</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- normalize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <!-- css -->
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <!-- converts markdown to html (like **bold**) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify - Security (Strips out malicious code (like <script> tags or onerror attributes) from the generated HTML) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  </head>

  <body>
    <div class="top">
      <div class="wrapper">
        <div class="logo">AskYourPDF</div>
      </div>
    </div>
    <div class="container">
      <div class="left">
        <h2>Upload PDF</h2>

        <div class="uploadContainer">
          <input
            type="password"
            id="apiKey"
            placeholder="1. Enter your OpenAI API key"
          />
          
          <input type="file" id="pdfInput" class="inputfile" accept=".pdf" />
          <label for="pdfInput"><span>2. Choose a file</span></label>
          <button id="uploadPdfButton">3. Upload PDF</button>
        </div>

        <p id="statusError"></p>

        <hr />

        <h3>PDF Viewer</h3>

        <div>
          <button id="prevPage">Previous</button>
          <span id="pageNum">0</span> / <span id="pageCount">0</span>
          <button id="nextPage">Next</button>
        </div>

        <div class="pdfContainer" id="pdfContainer">
          <canvas id="pdfCanvas"></canvas>
          <div id="textLayer" class="textLayer"></div>
          <div id="linkLayer" class="linkLayer"></div>
        </div>
      </div>

      <div class="right">
        <h2>AI Assist</h2>

        <div id="chat">
          <div class="message ai">Upload a PDF and ask me anything about it.</div>
        </div>

        <!-- <input type="text" id="question" placeholder="Ask a question..." /> -->

        <div class="questionWrapper">
          <textarea 
            id="question" 
            placeholder="Ask a question..."
            maxlength="500"
            rows="1"
          ></textarea>
          <button id="askBtn" disabled>Ask</button>
        </div>
      </div>
    </div>

    <!-- jquery -->
    <script
      src="https://code.jquery.com/jquery-3.4.0.min.js"
      integrity="sha256-BJeo0qm959uMBGb65z40ejJYGSgR7REI4+CW1fNKwOg="
      crossorigin="anonymous"
    ></script>

    <!-- loader -->
    <script type="module" src="/js/loader.js"></script>

    <script src="/js/main.js"></script>
  </body>
</html>
