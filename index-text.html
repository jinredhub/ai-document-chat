
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer</title>

  <style>
    .pdfContainer {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    #pdfCanvas {
      display: block;
    }

    /* Selectable text layer */
    .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 1;
      transform-origin: 0 0;
      user-select: text;
      -webkit-user-select: text;
    }

    .textLayer span {
      position: absolute;
      white-space: pre;
      color: transparent;
      transform-origin: 0 0;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }

    .textLayer ::selection {
      background: rgba(0, 100, 255, 0.3);
    }
  </style>
</head>

<body>
  <main>
    <h2>PDF viewer</h2>

    <input type="file" id="pdfInput" accept=".pdf" />

    <div>
      <button id="prevPage">Previous</button>

      <span id="pageNum">0</span> /
      <span id="pageCount">0</span>

      <button id="nextPage">Next</button>
    </div>

    <div class="pdfContainer">
      <canvas id="pdfCanvas"></canvas>
      <div id="textLayer" class="textLayer"></div>
    </div>
  </main>

  <script type="module">
    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.worker.mjs";

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 0.8;

    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d");
    const textLayerDiv = document.getElementById("textLayer");

    // Render PDF page and selectable text layer
    async function renderPage(num) {
      pageRendering = true;

      try {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale });

        // Set canvas dimensions
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        // Set text layer dimensions
        textLayerDiv.innerHTML = "";
        textLayerDiv.style.width = `${viewport.width}px`;
        textLayerDiv.style.height = `${viewport.height}px`;

        // Render PDF canvas
        await page.render({
          canvasContext: ctx,
          viewport: viewport,
        }).promise;

        // Get PDF text content
        const textContent = await page.getTextContent();

        // Render selectable text layer
        const textLayer = new pdfjsLib.TextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport: viewport,
        });

        await textLayer.render();

        // Update page number
        document.getElementById("pageNum").textContent = num;

      } catch (error) {
        console.error("Page rendering error:", error);
      } finally {
        pageRendering = false;

        if (pageNumPending !== null) {
          const pendingPage = pageNumPending;
          pageNumPending = null;
          renderPage(pendingPage);
        }
      }
    }

    // Queue page rendering
    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    // Load PDF
    document
      .getElementById("pdfInput")
      .addEventListener("change", async (e) => {
        const file = e.target.files[0];

        if (!file) return;

        try {
          const buffer = await file.arrayBuffer();

          pdfDoc = await pdfjsLib.getDocument({
            data: new Uint8Array(buffer),
          }).promise;

          pageNum = 1;
          pageNumPending = null;

          document.getElementById("pageCount").textContent =
            pdfDoc.numPages;

          await renderPage(pageNum);

        } catch (error) {
          console.error("PDF loading error:", error);
        }
      });

    // Previous page
    document
      .getElementById("prevPage")
      .addEventListener("click", () => {
        if (!pdfDoc || pageNum <= 1) return;

        pageNum--;
        queueRenderPage(pageNum);
      });

    // Next page
    document
      .getElementById("nextPage")
      .addEventListener("click", () => {
        if (!pdfDoc || pageNum >= pdfDoc.numPages) return;

        pageNum++;
        queueRenderPage(pageNum);
      });

  </script>
</body>
</html>
